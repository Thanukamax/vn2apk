[package]
name = "vn2apk"
version = "0.1.0"
description = "Convert PC VN/RPG game folders to signed Android APKs"
authors = ["Thanukamax"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vn2apk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vn2apk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
which = "8"
uuid = { version = "1", features = ["v4"] }
fs_extra = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
